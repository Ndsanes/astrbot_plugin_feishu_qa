<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeishuQA 控制台</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>FeishuQA 控制台</h1>
        <p class="muted">按使用场景整理的全部设置 · 保存后按需重载</p>
      </div>
      <div class="header-actions">
        <span id="dirty" class="badge hidden">有未保存修改</span>
        <button id="reset-defaults" class="btn ghost" type="button">恢复默认值</button>
        <button id="reload-plugin" class="btn ghost" type="button">重载插件</button>
        <button id="save" class="btn primary" type="button">保存</button>
      </div>
    </header>

    <p id="global-msg" class="msg" role="status"></p>

    <div class="layout">
      <nav id="toc" class="toc" aria-label="设置分组"></nav>

      <main id="form" class="form"></main>

      <aside class="side">
        <section class="card">
          <h2>运行状态</h2>
          <dl class="kv">
            <div><dt>语料条目</dt><dd id="st-entries">–</dd></div>
            <div><dt>图片</dt><dd id="st-images">–</dd></div>
            <div><dt>来源</dt><dd id="st-sources">–</dd></div>
            <div><dt>revision</dt><dd id="st-revision">–</dd></div>
            <div><dt>最后构建</dt><dd id="st-built">–</dd></div>
          </dl>
        </section>

        <section class="card">
          <h2>最近判定</h2>
          <p class="muted">最新的判定在最上面；用来确认某个问题到底答没答、差多少分。</p>
          <ul id="recent-decisions" class="decisions"></ul>
        </section>

        <section class="card">
          <h2>官方手册 PDF</h2>
          <p id="manual-status">–</p>
          <p id="manual-meta" class="muted"></p>
          <div class="actions">
            <button id="check-manual" class="btn primary" type="button">立即检查</button>
          </div>
          <p id="manual-msg" class="msg" role="status"></p>
          <p class="hint">
            有更新时在装了 pymupdf 的环境执行
            <code>kb_sync.py --all --kb-name "Cakewalk sonar" --replace</code>
          </p>
        </section>
      </aside>
    </div>

    <footer class="save-bar">
      <span id="save-state">所有修改已保存</span>
      <div class="actions">
        <button id="save-bottom" class="btn primary" type="button">保存</button>
        <button id="save-reload" class="btn ghost" type="button">保存并重载</button>
      </div>
    </footer>
  </body>
</html>
